# 添付ファイル保存先の設定例
# storage.type: s3
# database / LOB table mode は stopgap 契約で禁止。
storage:
  type: s3
  s3:
    bucket: opendolphin-attachments
    region: ap-northeast-1
    endpoint: http://minio:9000
    basePath: clinics/${FACILITY_ID}/documents
    forcePathStyle: true
    serverSideEncryption: AES256
    kmsKeyId: null
    multipartUploadThresholdMb: 64
    lifecycle:
      transitionToStandardIaAfterDays: 30
      expireAfterDays: 3650
