name: server-modernized-static-analysis-gate

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-modernized-static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis-gate:
    # Baseline burn-down is still in progress, so keep this off the default PR green path.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run WS9 surface guards
        run: bash ./scripts/ci/verify-phase3-surface-guards.sh all

      - name: Run reporting release-critical tests
        run: bash ./scripts/reporting/verify.sh

      - name: Run packaging and quality gates
        run: bash ./scripts/server-modernized/verify-static-analysis.sh

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            server-modernized/target/static-analysis/**/*.xml
            reporting/target/static-analysis/**/*.xml
            server-modernized/target/opendolphin-server.war
