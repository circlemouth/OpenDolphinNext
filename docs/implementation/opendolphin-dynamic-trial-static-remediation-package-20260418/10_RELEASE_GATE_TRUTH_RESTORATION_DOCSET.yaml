inline_context:
  blocker_name: release-gate truth restoration
  grounded_facts:
    - QA medical-information helper currently detects Medical_Information while actual browser request body uses medicalInformation
    - release-validation and cutover docs currently read as if scripts already fail on that actual leak
    - blocked-route guard still exempts /api/orca/queue and /api/orca/pusheventgetv2
    - older follow-up docsets still carry forward runtime-ready-smoke / npm run ci / server verify pass claims that are not current truth
  fixed_premises:
    - reception runtime contract itself is already a pass area
    - the task is to fix gate truthfulness, not to redesign Reception
    - route taxonomy public surface must not widen
    - live ORCA / WebORCA execution is out of scope
  expected_fix_direction:
    - align omission gate to actual browser request payload shape
    - keep script self-failure and artifact retention
    - align runbook / cutover wording to actual fail condition
    - either remove stale queue/pushevent exceptions or document them as intentional current truth with no ambiguous wording
    - remove or downgrade carried-forward pass claims to explicit not-verified / rerun-required wording

