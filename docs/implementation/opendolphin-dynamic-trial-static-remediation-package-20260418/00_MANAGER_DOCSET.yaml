do_not_invent:
  - live ORCA / WebORCA success claims
  - business success rules not evidenced by current server contract/service
  - route taxonomy exception policy without repo evidence
  - hidden-detail-only fixes for must-visible information
  - assertion weakening in place of contract repair
  - new persistence / resume behavior
  - new patient-global positive fallback
  - new public route / DTO / state owner
