inline_context:
  final_static_verdict:
    - NO-GO FOR DYNAMIC TRIAL CHECK until the remaining static tasks are closed
  grounded_blockers:
    - C7: medical-information omission gate looks for Medical_Information while actual browser request body uses medicalInformation
    - C5: patient import treats HTTP 200 as accepted success and does not separate business PARTIAL/errors from full success
    - C3: row-local production call sites exist, but report/order-panel/timeline direct negative tests are still insufficient
    - C6: OrcaSummary visibility tests still allow DOM-presence-only pass for must-visible notes/labels
    - R-OBS-01: clientAuthConfigured is reported through a settings path that currently returns false
    - T-NEG-01: sanitize negative tests do not fully lock rendered log / audit details / readiness detail surfaces
    - RT-01: route taxonomy guard still exempts queue/pushevent strings; docs/guard/source are not fully aligned
    - docs drift: older follow-up docsets still carry forward runtime-ready-smoke / npm run ci / server verify pass claims that are not current truth
  fixed_premises:
    - backward compatibility is not required
    - build artifacts, logs, screenshots, test-results, and worktree artifacts are ignored
    - reception official flow is a pass area and must stay intact
    - administration / manageusers is a pass area and must stay intact
    - C1/C2 core fail-close and sanitize behavior are already closed and must not be reopened
    - C4 current OrcaSummary layout direction is already closed and must not be regressed
    - send success != paid must remain
    - important information must not be hidden in disclosure
    - one screen one primary must remain
    - no new public route / DTO / state owner
    - external sites and general theory are out of scope for this package

