inline_context:
  blocker_name: patient import full-success semantics
  grounded_facts:
    - create/update and dialog canonical readback handling are partially fixed already
    - official import still conflates HTTP 200 with business success
    - server-side import response can return apiResult=10 and apiResultMessage=PARTIAL with errors while staying HTTP 200
    - current UI full-success copy hangs on the import API result.ok decision
  fixed_premises:
    - local search separation stays intact
    - official/local route boundary stays intact
    - patient context contract stays intact
    - no new route / DTO / state owner
  expected_fix_direction:
    - full success = business success by current server contract + canonical readback success
    - write accepted but partial business outcome must stay warning / partial
    - add direct negative coverage for import PARTIAL/errors and create/update readback failure branches

