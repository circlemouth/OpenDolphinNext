confirmed_accessible_file:
  - docs/web-client/ux/dads_app_ui_design_rules_20260411.md

inline_context:
  blocker_name: Billing / Charts OrcaSummary mount contract
  known_failure:
    - tests/charts/e2e-orca-billing-status.spec.ts line 203
  judgement:
    - treat as mount contract gap before locator typo
  known_code_fact:
    - OrcaSummary component body exists around OrcaSummary.tsx line 635
  expected_fix_direction:
    - separate claim-send eligibility from summary visibility
    - mount summary shell with minimal charts context
    - when ORCA context is insufficient, show fallback shell rather than hiding
    - place stable locator on the shell
  ownership_note:
    - billing core is primary owner
    - charts main contract boundary may require confirmation

repo_touchpoints:
  - web-client/src/features/charts/OrcaSummary.tsx
  - web-client/src/features/charts/pages/ChartsPage.tsx
  - web-client/src/features/charts/ChartsActionBar.tsx
  - web-client/src/features/charts/ChartsPatientSummaryBar.tsx
  - tests/charts/e2e-orca-billing-status.spec.ts

required_tests:
  - Re-run tests/charts/e2e-orca-billing-status.spec.ts
  - Re-run touched charts/billing component/unit tests if present
  - cd web-client && npm run typecheck

do_not_invent:
  - exact decision symbol names before repo evidence
  - hidden-only summary behavior
  - patient context persistence or resume
  - new sent/paid semantics
  - new right-rail duties
  - domain-specific disabled-reason copy without repo precedent

subagent_prompts:
  - name: orca_summary_mount_handoff_probe
    model: gpt 5.4 high
    prompt: |
      ChartsPage から OrcaSummary までの mount / handoff path だけを調査してください。
      summary visibility が claim-send eligibility と誤って結合されていないか、
      actual decision points はどこかを特定してください。
      symbol 名が memo と違う場合は actual 名を返してください。
      コード変更はしないでください。
      出力は次だけに限定してください。
      - probable_root_cause
      - actual_decision_points_and_files
      - minimum_fix_recommendation
      - unknowns_that_must_remain_gated
  - name: orca_summary_shell_locator_probe
    model: gpt 5.4 high
    prompt: |
      OrcaSummary の shell/fallback/locator contract だけを調査してください。
      minimal charts context で shell が維持されるべきか、
      ORCA context 不足時の fallback pattern が repo にあるか、
      stable locator をどこに置くべきかを見てください。
      ChartsActionBar と ChartsPatientSummaryBar は境界に影響するときだけ見てください。
      コード変更はしないでください。
      出力は次だけに限定してください。
      - shell_vs_content_findings
      - fallback_shell_strategy_following_repo_patterns
      - locator_strategy_following_repo_conventions
      - smallest_retest_set
