confirmed_accessible_file:
  - docs/web-client/ux/dads_app_ui_design_rules_20260411.md

inline_context:
  blocker_name: Reception transmission projection
  known_failure:
    - tests/reception/e2e-rec-001-status-mvp.spec.ts line 119
  judgement:
    - treat as projection bug before spec drift
  known_code_fact:
    - send display code exists in ReceptionPage.tsx around line 5559
  expected_fix_direction:
    - align row-local billing signal key and row projection
    - commonize table/collapsed-card transmission slot if both exist
    - expose sent state in an always-visible slot
    - add stable locator/testid to the transmission slot

repo_touchpoints:
  - web-client/src/features/reception/pages/ReceptionPage.tsx
  - web-client/src/features/reception/receptionDailyState.ts
  - web-client/src/features/charts/orcaClaimSendCache.ts
  - tests/reception/e2e-rec-001-status-mvp.spec.ts

required_tests:
  - Re-run tests/reception/e2e-rec-001-status-mvp.spec.ts
  - Re-run touched reception component/unit tests if present
  - cd web-client && npm run typecheck

do_not_invent:
  - actual row key names before repo evidence
  - actual cache schema before repo evidence
  - locator names before repo convention is checked
  - hidden-detail-only presentation for send status
  - patient context persistence or right-rail role changes

subagent_prompts:
  - name: reception_transmission_dataflow_probe
    model: gpt 5.4 high
    prompt: |
      Reception transmission signal の data flow だけを調査してください。
      source -> state/cache -> row projection -> render model を追跡し、
      key mismatch / projection omission / stale handoff / row-model mismatch のどれが最も有力かを特定してください。
      コード変更はしないでください。
      出力は次だけに限定してください。
      - probable_root_cause
      - exact_files_and_functions_to_touch
      - minimum_fix_recommendation
      - unknowns_that_must_remain_unknown
  - name: reception_row_render_locator_probe
    model: gpt 5.4 high
    prompt: |
      Reception row の render contract と locator contract だけを調査してください。
      table row と collapsed card が両方あるなら visible contract を比較し、
      send status が hidden detail/disclosure に逃げていないかを見てください。
      repo の stable locator/test hook convention も調べてください。
      コード変更はしないでください。
      出力は次だけに限定してください。
      - render_contract_findings
      - always_visible_slot_recommendation
      - locator_strategy_following_repo_conventions
      - smallest_retest_set
