confirmed_accessible_file:
  - docs/web-client/ux/dads_app_ui_design_rules_20260411.md

inline_context:
  blocker_name: Conditional print preview app-side fix
  trigger:
    - Task 30 found explicit route-state path
    - and the app still did not settle deterministically to preview shell or missing-state shell
  fixed_premises:
    - print preview is route-state only
    - patient context is non-persistent
    - missing-state must fail closed
    - storage resume must not return
  expected_fix_direction:
    - deterministic preview shell when route-state is sufficient
    - deterministic missing-state shell when route-state is absent/unknown
    - no persistence/resume restoration
    - mount side-effect stabilization only as needed
    - stable locator/testid on both shell states

repo_touchpoints:
  - web-client/src/features/charts/pages/ChartsDocumentPrintPage.tsx
  - web-client/src/features/charts/print/documentPrintPreviewStorage.ts
  - tests/e2e/charts-report-print.msw.spec.ts

required_tests:
  - Re-run tests/e2e/charts-report-print.msw.spec.ts
  - Re-run touched charts/print component/unit tests if present
  - cd web-client && npm run typecheck

do_not_invent:
  - actual route-state payload shape before repo evidence
  - storage keys or resume behavior not already in repo
  - domain-specific missing-state copy without repo precedent
  - timeout-only or wait-only workarounds
  - patient context persistence
  - unrelated report/print UX redesign

subagent_prompts:
  - name: print_route_state_failclose_probe
    model: gpt 5.4 high
    prompt: |
      print preview page の route-state contract と fail-close behavior だけを調査してください。
      minimum required state は何か、
      missing-state がどのように収束するべきか、
      storage coupling が route-state-only 原則に反していないかを見てください。
      コード変更はしないでください。
      出力は次だけに限定してください。
      - probable_root_cause
      - actual_route_state_decision_points
      - minimum_fix_recommendation
      - unknowns_that_must_remain_gated
  - name: print_mount_sideeffect_probe
    model: gpt 5.4 high
    prompt: |
      mount-time side effect、non-settle/hang source、preview/missing shell locator contract だけを調査してください。
      deterministic shell state をどう作るべきかを見てください。
      コード変更はしないでください。
      出力は次だけに限定してください。
      - hang_source_hypothesis
      - deterministic_shell_recommendation
      - locator_strategy_following_repo_conventions
      - smallest_retest_set
