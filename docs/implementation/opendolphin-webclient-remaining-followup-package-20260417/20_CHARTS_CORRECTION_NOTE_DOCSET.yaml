confirmed_accessible_files:
  - docs/web-client/ux/dads_app_ui_design_rules_20260411.md
  - docs/implementation/opendolphin-webclient-implementation-package-20260416/
  - artifacts/review-bundles/OpenDolphin_WebClient-review-package-curated-20260417T101132Z.zip
  - docs/implementation/opendolphin-webclient-followup-release-gate-package-20260417/

inline_context:
  blocker_name: charts correction-note / setting-note follow-up
  latest_report_facts:
    - actual charts spec path is tests/charts/e2e-billing-correction-note.spec.ts
    - actual reception spec path is tests/reception/e2e-billing-correction-note.spec.ts and it passed
    - latest failure report says orca-billing-setting-note was absent and expected text around 収納情報の確認前です did not match
  grounded_docs:
    - web-client/notes/billing-boundary-correction-scenarios.md says correction and setting are separate layers and separate cards / separate wording
    - docs/implementation/opendolphin-webclient-implementation-package-20260416/05_screen_state_copy_spec.md says correction note and setting note are separate slots and important info must not go into disclosure
    - the same implementation package says primary CTA, encounter context, send guard, correction note, and setting note are always visible
  grounded_runtime_fact:
    - current review package places correction/setting note cards inside OrcaSummary details fold
  expected_fix_direction:
    - keep correction and setting as separate slots
    - keep them must-visible rather than details-only
    - align charts spec data with the current billing decision path
    - do not reopen Reception unless regression is found

repo_touchpoints:
  - tests/charts/e2e-billing-correction-note.spec.ts
  - tests/reception/e2e-billing-correction-note.spec.ts
  - web-client/src/features/charts/OrcaSummary.tsx
  - web-client/src/features/charts/orcaBillingStatus.ts
  - web-client/src/features/charts/orcaClaimSendCache.ts
  - web-client/src/features/charts/__tests__/orcaSummary.billing-status.test.ts
  - web-client/notes/billing-boundary-correction-scenarios.md
  - web-client/notes/ui-current-contract.md
  - docs/implementation/opendolphin-webclient-implementation-package-20260416/05_screen_state_copy_spec.md

required_tests:
  - cd web-client && npm run typecheck
  - touched unit/component tests
  - PLAYWRIGHT_WEB_PORT=<repo convention> RUN_ID=<new> npx playwright test tests/charts/e2e-billing-correction-note.spec.ts
  - PLAYWRIGHT_WEB_PORT=<repo convention> RUN_ID=<new> npx playwright test tests/reception/e2e-billing-correction-note.spec.ts
  - cd web-client && npm run ci

do_not_invent:
  - a paid/unresolved scenario without repo-backed test data
  - a disclosure-only note pattern for important info
  - new sent/paid semantics
  - reopened Reception blocker without regression evidence

subagent_prompts:
  - name: charts_note_visibility_probe
    model: gpt 5.4 high
    prompt: |
      OrcaSummary の note visibility contract だけを調査してください。
      correction note と setting note が details fold の内側にあるか、must-visible area にあるべきかを、repo docs と current runtime の差分で整理してください。
      コード変更はしないでください。
      出力は次だけに限定してください。
      - runtime_vs_doc_contract_gap
      - exact_files_and_sections_to_touch
      - minimum_visibility_fix_recommendation
      - smallest_retest_set
  - name: charts_correction_spec_scenario_probe
    model: gpt 5.4 high
    prompt: |
      tests/charts/e2e-billing-correction-note.spec.ts と related billing decision path だけを調査してください。
      setting note が出ない理由が stale scenario なのか runtime defect なのかを repo evidence で切り分けてください。
      raw sessionStorage seed と helper seed のどちらが current contract と矛盾しているかも見てください。
      コード変更はしないでください。
      出力は次だけに限定してください。
      - probable_root_cause
      - scenario_or_runtime_owner
      - minimum_fix_recommendation
      - unknowns_that_must_remain_gated
