confirmed_accessible_files:
  - docs/web-client/ux/dads_app_ui_design_rules_20260411.md
  - docs/implementation/opendolphin-webclient-implementation-package-20260416/
  - artifacts/review-bundles/OpenDolphin_WebClient-review-package-curated-20260417T101132Z.zip

inline_context:
  blocker_name: claim-send cache storage contract hardening
  grounded_facts:
    - web-client/notes/security-spec.md says invoice numbers and warning details must not be persisted for orca-claim-send / orca-income-info
    - web-client/src/features/charts/orcaClaimSendCache.ts comment says invoiceNumber and medicalWarnings are not to be persisted
    - current saveOrcaClaimSendCache serializes medicalWarnings into sessionStorage
    - charts correction-note spec seeds raw sessionStorage with invoiceNumber and medicalWarnings
  fixed_premises:
    - patient context is non-persistent
    - send success != paid
    - important information must not be hidden in disclosure
    - unknowns remain gated with fail-close fallback
  expected_fix_direction:
    - remove invoiceNumber and medicalWarnings from sessionStorage serialization
    - keep warning detail volatile-only
    - use correctionKind/correctionReason or fail-close when reloaded detail is unavailable
    - align tests to the current storage contract

repo_touchpoints:
  - web-client/src/features/charts/orcaClaimSendCache.ts
  - web-client/src/features/charts/orcaBillingStatus.ts
  - web-client/src/features/charts/OrcaSummary.tsx
  - web-client/src/features/charts/OrderBundleEditPanel.tsx
  - web-client/src/features/charts/OrderDockPanel.tsx
  - web-client/src/features/charts/orcaClaimSendCache.test.ts
  - web-client/src/features/charts/__tests__/orcaSummary.billing-status.test.ts
  - tests/charts/e2e-billing-correction-note.spec.ts
  - tests/charts/e2e-orca-billing-status.spec.ts

required_tests:
  - cd web-client && npm run typecheck
  - touched unit/component tests for cache and billing summary
  - PLAYWRIGHT_WEB_PORT=<repo convention> RUN_ID=<new> npx playwright test tests/charts/e2e-billing-correction-note.spec.ts
  - PLAYWRIGHT_WEB_PORT=<repo convention> RUN_ID=<new> npx playwright test tests/charts/e2e-orca-billing-status.spec.ts

do_not_invent:
  - new persisted PHI-bearing fields
  - warning detail reconstruction after reload without repo evidence
  - persistence/resume behavior for patient context
  - new sent/paid semantics

subagent_prompts:
  - name: claim_send_storage_contract_probe
    model: gpt 5.4 high
    prompt: |
      ORCA claim-send cache の storage contract だけを調査してください。
      security-spec と current implementation を比較し、sessionStorage に残してよい field と残してはいけない field を repo evidence で整理してください。
      コード変更はしないでください。
      出力は次だけに限定してください。
      - persisted_fields_allowed
      - persisted_fields_forbidden
      - exact_files_and_functions_to_touch
      - minimum_fix_recommendation
  - name: claim_send_consumer_impact_probe
    model: gpt 5.4 high
    prompt: |
      orcaClaimSendCache の consumer だけを調査してください。
      OrcaSummary / OrderBundleEditPanel / OrderDockPanel / related tests が persisted warning detail に依存していないかを見て、
      volatile-only 化した時の fail-close behavior と最小 retest set を提案してください。
      コード変更はしないでください。
      出力は次だけに限定してください。
      - consumer_dependencies
      - fail_close_behavior_recommendation
      - smallest_retest_set
      - unknowns_that_must_remain_gated
